# SPDX-License-Identifier: MPL-2.0

name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Validate repository
        run: mise run validate
      - name: Test repository validator
        run: mise run test-validator
      - name: Check licenses
        run: mise run check-licenses

  markdown-format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check Markdown formatting
        uses: rvben/rumdl@v0
        with:
          version: "0.2.77"
          command: fmt-check
          path: .
          config: .rumdl.toml
